[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlova"
version = "1.0.1"
description = "Transcribe audio, video and YouTube from your terminal or from Claude, Cursor and VS Code (MCP server)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SoleCreations" }]
keywords = ["mcp", "model-context-protocol", "transcription", "speech-to-text", "youtube", "subtitles", "claude", "cursor", "afrikaans"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://parlova.co.za"
Source = "https://github.com/fort652/parlova-mcp"

[project.scripts]
parlova = "parlova:main"

[tool.hatch.build.targets.wheel]
only-include = ["parlova.py"]

[tool.hatch.build.targets.sdist]
include = ["parlova.py", "README.md", "LICENSE", "pyproject.toml"]
